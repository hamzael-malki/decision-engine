<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MVP de la Decision Engine Platform">
  <title>Decision Engine Platform</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      background: #f6f8fb;
      color: #182230;
    }

    body {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header,
    section,
    form {
      background: #fff;
      border: 1px solid #d9e1ea;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    #category-view {
      background: transparent;
      border: none;
      padding: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.4s ease-out;
    }

    #category-view.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #category-view h2 {
      text-align: center;
      margin-bottom: 2rem;
    }

    #model-view {
      opacity: 1;
      transition: opacity 0.4s ease-in;
    }

    #model-view.hidden {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    #result {
      opacity: 1;
      transition: opacity 0.4s ease-in;
    }

    #result.hidden {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: 650;
      margin: 1rem 0 .4rem;
    }

    textarea,
    select,
    button {
      font: inherit;
      width: 100%;
      box-sizing: border-box;
    }

    textarea,
    select {
      border: 1px solid #9aa8b7;
      border-radius: 7px;
      padding: .7rem;
      min-height: 2.8rem;
    }

    textarea {
      min-height: 7rem;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: .8rem 1rem;
      background: #1769e0;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .error {
      color: #b42318;
    }

    pre {
      white-space: pre-wrap;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1rem;
      aspect-ratio: 1;
      margin: 0 auto;
      max-width: 700px;
    }

    .category-button {
      min-height: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 3px solid transparent;
      border-radius: 12px;
      padding: 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
      background: #fff;
      color: #182230;
    }

    .category-button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .category-button:nth-child(1) {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border-color: #667eea;
    }

    .category-button:nth-child(1):hover {
      background: linear-gradient(135deg, #5a67d8 0%, #6b4199 100%);
    }

    .category-button:nth-child(2) {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: #fff;
      border-color: #f093fb;
    }

    .category-button:nth-child(2):hover {
      background: linear-gradient(135deg, #e88ce9 0%, #e54d5b 100%);
    }

    .category-button:nth-child(3) {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #fff;
      border-color: #4facfe;
    }

    .category-button:nth-child(3):hover {
      background: linear-gradient(135deg, #3a9eee 0%, #00d4f5 100%);
    }

    .category-button:nth-child(4) {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      color: #182230;
      border-color: #43e97b;
    }

    .category-button:nth-child(4):hover {
      background: linear-gradient(135deg, #38d66b 0%, #2be6c7 100%);
    }

    .back-button {
      width: auto;
      margin-bottom: 1rem;
      background: #556575;
    }

    #result {
      margin-top: 1rem;
    }

    /* Result Renderers */
    .result-container {
      margin-top: 1.5rem;
    }

    .quadrant-grid,
    .swot-grid,
    .empathy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }

    .quadrant,
    .swot-box,
    .empathy-section {
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 1rem;
    }

    .quadrant h4,
    .swot-box h4,
    .empathy-section h4 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .quadrant ul,
    .swot-box ul,
    .empathy-section ul {
      margin: 0.5rem 0;
      padding-left: 1.2rem;
    }

    .quadrant li,
    .swot-box li,
    .empathy-section li {
      margin: 0.3rem 0;
      font-size: 0.95rem;
    }

    .quadrant.do-first {
      border-left: 4px solid #dc2626;
      background: #fef2f2;
    }

    .quadrant.schedule {
      border-left: 4px solid #f59e0b;
      background: #fffbf0;
    }

    .quadrant.delegate {
      border-left: 4px solid #10b981;
      background: #f0fdf4;
    }

    .quadrant.eliminate {
      border-left: 4px solid #9ca3af;
      background: #f9fafb;
    }

    .percentage {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 0.5rem 0;
    }

    .swot-box.strength {
      background: #f0fdf4;
      border-left: 4px solid #10b981;
    }

    .swot-box.weakness {
      background: #fef2f2;
      border-left: 4px solid #dc2626;
    }

    .swot-box.opportunity {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
    }

    .swot-box.threat {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
    }

    .strategy-matrix {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f3f4f6;
      border-radius: 8px;
    }

    .strategies {
      display: grid;
      gap: 0.5rem;
    }

    .strategy {
      padding: 0.7rem;
      background: #fff;
      border-left: 3px solid #3b82f6;
      border-radius: 4px;
    }

    .empathy-grid {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .empathy-section {
      text-align: center;
    }

    .grow-sections {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }

    .grow-section {
      border: 1px solid #d9e1ea;
      border-radius: 8px;
      padding: 1rem;
      background: #f9fafb;
    }

    .grow-section h4 {
      margin-top: 0;
      color: #1769e0;
    }

    .grow-section ul {
      margin: 0;
      padding-left: 1.2rem;
    }

    .coaching-questions {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      border-radius: 8px;
    }

    .coaching-questions h4 {
      margin-top: 0;
    }

    .fallback pre {
      background: #f3f4f6;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <header>
    <h1>Decision Engine Platform</h1>
    <p>Choisissez un objectif, puis un modèle de décision adapté.</p>
  </header>
  <main>
    <section id="category-view">
      <h2>Par où souhaitez-vous commencer ?</h2>
      <div id="category-list" class="category-grid"></div>
    </section>
    <section id="model-view" class="hidden">
      <button id="back-button" class="back-button" type="button">← Changer de thème</button>
      <h2 id="category-title"></h2>
      <form id="decision-form" novalidate>
        <label for="model-select">Modèle</label>
        <select id="model-select" name="model">
          <option value="">Sélectionnez votre modèle</option>
        </select>
        <p id="load-status" role="status">Sélectionnez votre modèle pour approfondir votre situation.</p>
        <div id="model-fields"></div>
        <button type="submit" disabled>Exécuter l'analyse</button>
      </form>
      <section id="result" class="hidden" aria-live="polite">
        <h2>Résultat</h2>
        <div id="result-content"></div>
      </section>
    </section>
  </main>
  <script type="module">
    import { engine } from './core/engine.js';
    import { state } from './core/state.js';
    import { eventBus } from './core/eventBus.js';
    import { validator } from './core/validator.js';
    import { StorageManager } from './storage/StorageManager.js';
    import { CategoryRouter } from './ui/CategoryRouter.js';
    import { renderResult } from './ui/ResultRenderer.js';

    const categoryView = document.querySelector('#category-view');
    const categoryList = document.querySelector('#category-list');
    const modelView = document.querySelector('#model-view');
    const categoryTitle = document.querySelector('#category-title');
    const form = document.querySelector('#decision-form');
    const select = document.querySelector('#model-select');
    const fields = document.querySelector('#model-fields');
    const status = document.querySelector('#load-status');
    const result = document.querySelector('#result');
    const resultContent = document.querySelector('#result-content');
    const submitButton = form.querySelector('button[type="submit"]');
    let registry;
    let visibleModels = [];

    try {
      registry = await fetch('./data/models.json').then(response => {
        if (!response.ok) throw new Error('Impossible de charger le registre des modèles.');
        return response.json();
      });
      validator.validateRegistry(registry.models);
      if (!Array.isArray(registry.categories) || registry.categories.length !== 4) throw new Error('Les catégories sont invalides.');
    } catch (error) {
      categoryList.textContent = 'Les modèles ne peuvent pas être chargés. Ouvrez le projet avec un serveur local ou via GitHub Pages.';
      categoryList.className = 'error';
      throw error;
    }

    const renderFields = () => {
      const model = visibleModels.find(item => item.id === select.value);
      result.classList.add('hidden');
      if (!model) {
        state.set('currentModel', null);
        fields.replaceChildren();
        status.textContent = 'Sélectionnez votre modèle pour approfondir votre situation.';
        submitButton.disabled = true;
        return;
      }
      state.set('currentModel', model);
      status.textContent = '';
      submitButton.disabled = false;
      fields.replaceChildren(...model.fields.map(field => {
        const label = document.createElement('label');
        label.htmlFor = field.id;
        label.textContent = field.label + (field.required ? ' *' : '');
        const input = document.createElement(field.type === 'textarea' ? 'textarea' : 'input');
        input.id = input.name = field.id;
        input.required = field.required;
        if (field.type !== 'textarea') input.type = field.type;
        label.append(input);
        return label;
      }));
    };

    const selectCategory = async category => {
      visibleModels = await CategoryRouter.getModelsByCategory(category.id, registry);
      categoryTitle.textContent = category.label;
      select.replaceChildren(new Option('Sélectionnez votre modèle', ''));
      visibleModels.forEach(model => select.add(new Option(model.name, model.id)));
      categoryView.classList.add('hidden');
      modelView.classList.remove('hidden');
      renderFields();
    };

    registry.categories.forEach(category => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'category-button';
      button.textContent = category.label;
      button.addEventListener('click', () => selectCategory(category));
      categoryList.append(button);
    });

    document.querySelector('#back-button').addEventListener('click', () => {
      state.set('currentModel', null);
      modelView.classList.add('hidden');
      categoryView.classList.remove('hidden');
    });
    select.addEventListener('change', renderFields);
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const model = visibleModels.find(item => item.id === select.value);
      const userInput = Object.fromEntries(new FormData(form));
      submitButton.disabled = true;
      try {
        const output = await engine.executeModel(model, userInput);
        resultContent.innerHTML = renderResult(output);
        resultContent.className = '';
        result.classList.remove('hidden');
      } catch (error) {
        resultContent.textContent = error.message;
        resultContent.className = 'error';
        result.classList.remove('hidden');
      } finally { submitButton.disabled = false; }
    });
    eventBus.subscribe('MODEL_FINISHED', event => StorageManager.save('lastExecution', { ...event, at: new Date().toISOString() }));
  </script>
</body>

</html>
